@if (isSpinnerVisible) {
  <div id="http-loader" role="status" aria-live="polite">
    <div class="loader-contenu">
      <div class="loader-rond">
        <span class="loader-anneau"></span>
        <i class="ti ti-sparkles loader-icone"></i>
      </div>
      <p class="loader-texte">{{ 'a.chargement_en_cours' | t }}</p>
    </div>
  </div>
}
