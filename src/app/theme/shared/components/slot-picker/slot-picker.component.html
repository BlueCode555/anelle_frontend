<div class="row g-3 mb-3">
  <div class="col-12 col-md-7">
    <label class="form-label" for="sp-service">Soin souhaité</label>
    <select id="sp-service" class="form-select" [value]="serviceCode()" (change)="onService($event)">
      <option value="" disabled>Choisir un soin</option>
      <option *ngFor="let s of services()" [value]="s.code" [selected]="s.code === serviceCode()">
        {{ s.nomService }} · {{ s.dureeMinutes }} min · {{ formatTarif(s.tarif) }}
      </option>
    </select>
  </div>
  <div class="col-12 col-md-5">
    <label class="form-label" for="sp-date">Jour</label>
    <input id="sp-date" type="date" class="form-control" [value]="date()" [min]="minDate()" (change)="onDate($event)" />
  </div>
</div>

<div *ngIf="error()" class="alert alert-warning">{{ error() }}</div>

<ng-container *ngIf="serviceCode(); else pickService">
  <div *ngIf="loading()" class="text-muted">Recherche des créneaux...</div>

  <div *ngIf="!loading() && dejaCharge() && !error() && creneaux().length === 0" class="text-muted">
    Aucun créneau disponible ce jour-là. Essayez un autre jour.
  </div>

  <div class="slots" *ngIf="!loading() && creneaux().length">
    <button
      type="button"
      class="slot"
      *ngFor="let c of creneaux()"
      [class.slot-active]="choisi() === c.debut"
      (click)="choisir(c)"
    >
      {{ heure(c.debut) }}
    </button>
  </div>
</ng-container>
<ng-template #pickService>
  <p class="text-muted mb-0">Choisissez un soin pour voir les créneaux disponibles.</p>
</ng-template>
