<div class="modal-header">
  <h5 class="modal-title">{{ 'a.changer_de_profil' | t }}</h5>
  <button type="button" class="btn-close" [attr.aria-label]="'a.fermer' | t" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <p class="text-muted mb-3">{{ 'a.choisissez_le_profil_avec_lequel_vous_voulez_tra' | t }}</p>

  <div class="profils">
    @for (p of profils(); track p.code) {
      <button type="button" class="profil-carte" [class.is-actuel]="p.code === actuel()" (click)="choisir(p)">
        <span class="profil-radio" aria-hidden="true">
          @if (p.code === actuel()) {
            <i class="ti ti-check"></i>
          }
        </span>
        <span class="profil-texte">
          <span class="profil-nom">{{ p.libelle }}</span>
          @if (p.description) {
            <span class="profil-desc">{{ p.description }}</span>
          }
          <span class="profil-ecrans">
            @for (e of ecrans(p); track e) {
              <span class="pastille">{{ e }}</span>
            } @empty {
              <span class="text-muted small">{{ 'a.aucun_ecran' | t }}</span>
            }
          </span>
        </span>
        @if (p.code === actuel()) {
          <span class="profil-badge">{{ 'a.en_cours' | t }}</span>
        }
      </button>
    }
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">{{ 'a.fermer' | t }}</button>
</div>
