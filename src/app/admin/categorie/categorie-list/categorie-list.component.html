<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Categories</h5>
    <button type="button" class="btn btn-primary btn-sm" (click)="openCreate()">
      <i class="ti ti-plus me-1"></i>Nouvelle categorie
    </button>
  </div>
  <div class="card-body">
    <div *ngIf="loading()" class="text-center text-muted py-4">Chargement...</div>

    <div *ngIf="error()" class="alert alert-danger">Impossible de charger les categories.</div>

    <div *ngIf="!loading() && !error() && categories().length === 0" class="text-center text-muted py-4">
      Aucune categorie pour le moment.
    </div>

    <div class="table-responsive" *ngIf="!loading() && categories().length">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Code</th>
            <th>Libelle</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cat of categories()">
            <td><span class="badge text-bg-secondary">{{ cat.code }}</span></td>
            <td>{{ cat.libelle }}</td>
            <td class="text-muted">{{ cat.description }}</td>
            <td class="text-end">
              <button type="button" class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(cat)">
                <i class="ti ti-edit"></i>
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(cat)">
                <i class="ti ti-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
