<div class="modal-header">
  <h5 class="modal-title">{{ categorieId ? 'Modifier la categorie' : 'Nouvelle categorie' }}</h5>
  <button type="button" class="btn-close" aria-label="Fermer" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <form id="categorieForm" (ngSubmit)="onSubmit($event)">
    <div *ngIf="serverError()" class="alert alert-danger">{{ serverError() }}</div>

    <div class="mb-3">
      <label class="form-label" for="libelle">Libelle</label>
      <input
        id="libelle"
        type="text"
        class="form-control"
        placeholder="Ex. Pedicure"
        [formField]="categorieForm.libelle"
        [class.is-invalid]="submitted() && categorieForm.libelle().invalid()"
      />
      @if (submitted() && categorieForm.libelle().invalid()) {
        <div class="invalid-feedback">
          @for (error of categorieForm.libelle().errors(); track error.kind) {
            <div>{{ error.message }}</div>
          }
        </div>
      }
    </div>

    <div class="mb-3">
      <label class="form-label" for="description">Description</label>
      <textarea id="description" class="form-control" rows="3" [formField]="categorieForm.description"></textarea>
    </div>

    <div class="mb-1">
      <label class="form-label" for="image">Image (affichee dans le carrousel du site)</label>
      <div *ngIf="imagePreview() as preview" class="image-preview mb-2">
        <img [src]="preview" alt="Apercu" />
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeImage()">
          <i class="ti ti-trash"></i> Retirer
        </button>
      </div>
      <input id="image" type="file" class="form-control" accept="image/jpeg,image/png,image/webp,image/avif" (change)="onImageSelected($event)" [disabled]="uploading()" />
      <input
        type="url"
        class="form-control mt-2"
        placeholder="... ou collez un lien https:// vers une image en ligne"
        [value]="categorieModel().imageUrl.startsWith('https://') ? categorieModel().imageUrl : ''"
        (change)="onImageUrlInput($event)"
      />
      <div class="form-text" *ngIf="uploading()">Envoi en cours...</div>
      <div class="text-danger small mt-1" *ngIf="uploadError()">{{ uploadError() }}</div>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Annuler</button>
  <button type="submit" form="categorieForm" class="btn btn-primary" [disabled]="saving()">
    {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
  </button>
</div>
